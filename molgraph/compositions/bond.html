<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 03, bond features: fourteen cells per bond, and the amide's two conjugated bonds.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #bond { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div id="bond" data-composition-id="bond" data-width="1920" data-height="1080">
        <div id="bond-bg" class="layer bg"></div>
        <div id="bond-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { D, AMBER, bondText, chapter } = emaki, { VIEW } = emaki.film; // kit.js, film.js
          const c = chapter("bond"), { layer, box, to, set, pop, pulse, appear, vanish, show, caption, HIDDEN, SMALL } = c;
          const tag = "03 · BOND FEATURES", G = D.graphs.A, M = D.mols.A, blocks = D.blocks.bond;
          const world = layer(), ui = layer(), m = c.mol(world, "A", VIEW.high);
          // a bond's features: the row of either of its two directed bonds, which are the same
          const feats = (b) => G.E[2 * b];
          const CO = M.bonds.findIndex(([i, j, order]) => order === 2);

          // ---------- the carbonyl bond: fourteen cells ----------
          caption(0.3, 8.6, { tag, title: "Fourteen numbers per bond", sub: "Its type, whether it is conjugated, whether it is in a ring, and its stereo." });
          m.light([CO], 1.0, 8.4, AMBER);
          const big = c.vec(ui, 960, 790, feats(CO), "bond", { cell: 40, gap: 5, space: 22, names: true, choices: true });
          const name = box(ui, `<div class="rowlbl" style="font-size:34px">${bondText("A", CO)}</div>`, 960 - big.W / 2 - 30, 790 + big.H / 2, { xPercent: -100, autoAlpha: 0 });
          gsap.set(big.el, HIDDEN); appear(big.el, 1.4, 0.5); big.name(1.6); appear(name, 1.6);
          blocks.forEach((b, n) => big.light(2.6 + n * 0.9, { only: big.hotOnes.filter((i) => i >= b.start && i < b.start + b.choices.length) }));
          vanish(big.el, 8.6); vanish(name, 8.6);

          // ---------- every bond; the amide's two are conjugated ----------
          caption(8.8, 15.8, { tag, title: "The amide is conjugated", sub: "C=O and C–N share π electrons, so both light the conjugated cell. The bonds to the methyls do not." });
          m.move(8.8, 10.0, VIEW.left);
          const TOP = 470, mx = c.matrix(ui, 1290, TOP, M.bonds.map((_, b) => ({ values: feats(b), label: bondText("A", b) })), "bond", { cell: 34, gap: 4, space: 18, rowgap: 14, names: true });
          mx.rows.forEach((r) => gsap.set([...r.cells, r.lbl], HIDDEN)); mx.rows[0].labels.flat().forEach((e) => { gsap.set(e, HIDDEN); appear(e, 9.8); });
          M.bonds.forEach((_, b) => { const t = 10.0 + b * 0.8, r = mx.rows[b];
            m.light([b], t, t + 0.75, AMBER); appear([...r.cells, r.lbl], t, 0.3); r.light(t + 0.25, { step: 0.08 }); });
          const conj = blocks.find((bl) => bl.name === "conjugated").start, amide = M.bonds.map((_, b) => b).filter((b) => feats(b)[conj]);
          mx.col(conj, AMBER, 13.6, 15.6);
          m.light(amide, 13.8, 15.6, AMBER);
          amide.forEach((b, k) => pulse(mx.rows[b].lbl.firstChild, 14.0 + k * 0.3, 1.15));

          // ---------- a bond has no direction yet ----------
          caption(16.0, 22.6, { tag, title: "One row per bond", sub: "But a bond's row says nothing of which way it points. The next chapter gives every bond a direction." });
          const shape = box(ui, `<div class="shape">${M.bonds.length} × ${G.E[0].length}</div>`, 1290, TOP + mx.H + 64, SMALL); pop(shape, 16.6);

          c.fadeIn(); c.fadeOut();
          window.__timelines["bond"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
