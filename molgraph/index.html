<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>MolGraph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="data.js"></script>
    <script src="kit.js"></script>
    <script src="film.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="174" data-width="1920" data-height="1080">
      <!-- One clip per chapter, each a sub-composition. `node sync-clips.mjs` sets the starts and durations
           from the chapter table in film.js. -->
      <div id="el-intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-atom" class="clip" data-composition-id="atom" data-composition-src="compositions/atom.html" data-start="8" data-duration="31" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-matrix" class="clip" data-composition-id="matrix" data-composition-src="compositions/matrix.html" data-start="39" data-duration="22" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-bond" class="clip" data-composition-id="bond" data-composition-src="compositions/bond.html" data-start="61" data-duration="23" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-directed" class="clip" data-composition-id="directed" data-composition-src="compositions/directed.html" data-start="84" data-duration="31" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-input" class="clip" data-composition-id="input" data-composition-src="compositions/input.html" data-start="115" data-duration="27" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-drug" class="clip" data-composition-id="drug" data-composition-src="compositions/drug.html" data-start="142" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="167" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      // every chapter animates itself; the film's own timeline has nothing to do
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
