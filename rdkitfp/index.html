<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>RDKit Fingerprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="data.js"></script>
    <script src="kit.js"></script>
    <script src="film.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="190.8" data-width="1920" data-height="1080">
      <!-- One clip per chapter, each a sub-composition. `node sync-clips.mjs` sets the starts and durations
           from the chapter table in film.js. -->
      <div id="el-intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="7.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-atoms" class="clip" data-composition-id="atoms" data-composition-src="compositions/atoms.html" data-start="7.8" data-duration="18" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-fragments" class="clip" data-composition-id="fragments" data-composition-src="compositions/fragments.html" data-start="25.8" data-duration="32.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-hash" class="clip" data-composition-id="hash" data-composition-src="compositions/hash.html" data-start="58" data-duration="26" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-bits" class="clip" data-composition-id="bits" data-composition-src="compositions/bits.html" data-start="84" data-duration="37.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-similarity" class="clip" data-composition-id="similarity" data-composition-src="compositions/similarity.html" data-start="121.4" data-duration="38.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-drug" class="clip" data-composition-id="drug" data-composition-src="compositions/drug.html" data-start="159.8" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="184.8" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      // every chapter animates itself; the film's own timeline has nothing to do
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
