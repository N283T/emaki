<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 01, atoms and bonds: an atom is reduced to its element, a bond to its order and the elements it joins.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #atoms { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
        #atoms .kept { font: 700 24px Inter; letter-spacing: .08em; text-transform: uppercase; }
      </style>

      <div id="atoms" data-composition-id="atoms" data-width="1920" data-height="1080">
        <div id="atoms-bg" class="layer bg"></div>
        <div id="atoms-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { D, GREEN, chapter } = emaki, { VIEW } = emaki.film; // kit.js, film.js
          const c = chapter("atoms"), { layer, box, to, pop, pulse, vanish, caption, HIDDEN, SMALL } = c;
          const tag = "01 · ATOMS AND BONDS", V = VIEW.wide;
          const world = layer(), ui = layer(), m = c.mol(world, "A", V), M = m.M;

          // ---------- what an atom is: its element, and little else ----------
          caption(0.3, 8.6, { tag, title: "An atom is its element", sub: "Plus one flag: aromatic or not. Hydrogens, charge and neighbours are not looked at." });
          [["Element", true], ["Aromatic or not", true], ["Hydrogens", false], ["Charge", false], ["Neighbours", false]].forEach(([name, kept], k) => {
            const el = box(ui, `<div class="card"${kept ? "" : ' style="color:#75809f"'}>${name}<b class="kept" style="color:${kept ? GREEN : "#75809f"}">${kept ? "kept" : "ignored"}</b></div>`, 1560, 420 + k * 92, HIDDEN);
            to(el, 1.3 + k * 0.4, 1.8 + k * 0.4, { autoAlpha: 1, x: 1520 }); vanish(el, 8.5);
          });
          // the hydrogens drop out of the labels
          M.atoms.forEach((_, n) => m.strip(n, 4.8 + n * 0.25));

          // ---------- what a bond is: its order, and the two elements it joins ----------
          caption(8.8, 17.6, { tag, title: "A bond knows what it joins", sub: "Its order and its two elements. The two C–N bonds look exactly alike." });
          const centre = emaki.centre(M), { bondName } = emaki.film;
          const chips = M.bonds.map(([i, j, order], n) => {
            const A = M.atoms[i], B = M.atoms[j], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, L = Math.hypot(B.x - A.x, B.y - A.y);
            let nx = (B.y - A.y) / L, ny = (A.x - B.x) / L; if (nx * (mx - centre[0]) + ny * (my - centre[1]) < 0) [nx, ny] = [-nx, -ny]; // away from the middle
            const el = box(ui, `<div class="bondchip">${bondName(n)}</div>`, ...m.screen(mx + nx * 84, my + ny * 84), SMALL);
            pop(el, 9.6 + n * 0.6); vanish(el, 17.4);
            return el;
          });
          const same = M.bonds.map((b, n) => n).filter((n) => bondName(n) === "C–N");
          m.light(same, 13.2, 17.2); same.forEach((n) => { pulse(chips[n].firstChild, 13.4, 1.2); pulse(chips[n].firstChild, 15.0, 1.2); });
          window.__timelines["atoms"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
