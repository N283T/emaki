<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 04, two bits: every fragment turns on two bits of a short bit vector, where different fragments can collide.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #bits { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
        #bits .id { font-size: 24px; }
        #bits .id b { color: var(--blue); margin-left: 0; }
      </style>

      <div id="bits" data-composition-id="bits" data-width="1920" data-height="1080">
        <div id="bits-bg" class="layer bg"></div>
        <div id="bits-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { D, BLUE, AMBER, RED, fmt, chapter } = emaki, { VIEW, F, sizes, thumbHTML, rowHTML, FOCUS, slot, rowLabel, strip, STRIP, WALL } = emaki.film; // kit.js, film.js
          const c = chapter("bits"), { layer, canvas, box, to, pulse, appear, vanish, fly, link, caption, HIDDEN } = c;
          const tag = "04 · TWO BITS", SIZE = D.size.A;
          const back = layer(), wires = canvas(), ui = layer(), m = c.mol(back, "A", VIEW.left, { plain: true });
          const thumbs = F.map((f, n) => box(ui, thumbHTML(f), ...slot(n)));
          const gone = [...sizes.map((k, r) => box(ui, rowHTML(k), ...rowLabel(r), { xPercent: -100 })), ...F.map((f, n) => box(ui, `<div class="seed">${fmt(f.seed)}</div>`, slot(n)[0], slot(n)[1] + 71)), m.cam];
          const under = (n, dx = 0) => [strip(n)[0] + dx, strip(n)[1] + 54]; // where a fragment's links leave its picture
          const only = (keep, t0, t1) => { const rest = thumbs.filter((_, n) => !keep.includes(n)); to(rest, t0, t0 + 0.5, { autoAlpha: 0.2 }); to(rest, t1 - 0.4, t1, { autoAlpha: 1 }); };

          // ---------- the wall: a short vector ----------
          caption(0.3, 6.8, { tag, title: "A wall of bits", sub: `RDKit's default is 2048 bits. Here, to keep every bit in view: ${SIZE}.` });
          to(gone, 0.4, 1.0, { autoAlpha: 0 });
          thumbs.forEach((el, n) => fly(el, 0.7 + n * 0.04, 1.8 + n * 0.04, { x: strip(n)[0], y: strip(n)[1], scale: STRIP }));
          const wall = c.wall(back, ...WALL, { size: SIZE });
          gsap.set(wall.el, { autoAlpha: 0, y: WALL[1] + 50 }); to(wall.el, 1.7, 2.7, { autoAlpha: 1, y: WALL[1] });

          // ---------- one fragment, two bits ----------
          caption(7.0, 15.4, { tag, title: "Two bits per fragment", sub: `Bit one: seed mod ${SIZE}. Bit two: from a random number generator started with the seed.` });
          const f = F[FOCUS], [fx, fy] = strip(FOCUS);
          only([FOCUS], 7.2, 15.5);
          // the two notes stand side by side under the fragment, the one whose bit lies further left on the left,
          // so that each link can drop from its own note without crossing the other
          const leftFirst = wall.at(f.bits[0])[0] <= wall.at(f.bits[1])[0];
          [[`seed mod ${SIZE} = <b>${f.bits[0]}</b>`, 7.9, leftFirst ? -1 : 1], [`rng(seed) mod ${SIZE} = <b>${f.bits[1]}</b>`, 10.6, leftFirst ? 1 : -1]].forEach(([html, t, side], k) => {
            const x = fx + side * 190, y = fy + 82, note = box(ui, `<div class="id">${html}</div>`, x, y, HIDDEN); appear(note, t); vanish(note, 15.2);
            link(wires, [x, y + 22], wall.at(f.bits[k]), t + 0.5, 15.2, BLUE, 0.45); wall.on(f.bits[k], BLUE, t + 1.0);
          });

          // ---------- every other fragment ----------
          caption(15.6, 21.8, { tag, title: "Every fragment adds its two", sub: `${F.length} fragments could turn on ${F.length * 2} bits, if no two of them ever met.` });
          const on = new Set(f.bits);
          F.forEach((g, n) => { if (n === FOCUS) return; const t = 16.0 + (n - (n > FOCUS)) * 0.42;
            g.bits.forEach((b) => { link(wires, under(n), wall.at(b), t, t + 1.3, BLUE, 0.3); if (on.has(b)) wall.flash(b, t + 0.5); else wall.on(b, BLUE, t + 0.5); on.add(b); });
          });

          // ---------- two different fragments on one bit ----------
          const users = (b) => F.map((g, n) => n).filter((n) => F[n].bits.includes(b)), seeds = (b) => new Set(users(b).map((n) => F[n].seed)).size;
          const shared = D.bits.A.find((b) => seeds(b) > 1), pair = users(shared).filter((n, k, list) => list.findIndex((o) => F[o].seed === F[n].seed) === k);
          caption(22.0, 30.4, { tag, alert: true, title: "Collision", sub: "Two different fragments, one bit. But their second bits differ: that is the point of having two." });
          only(pair, 22.2, 30.4);
          wall.frame(shared, RED, 22.6, 30.2); wall.tint(shared, RED, 22.9); wall.tint(shared, BLUE, 29.9);
          pair.forEach((n, k) => {
            const other = F[n].bits.find((b) => b !== shared), t = 22.6 + k * 0.4;
            link(wires, under(n, -18), wall.at(shared), t, 30.1, RED, 0.3); pulse(thumbs[n].firstChild, t, 1.1);
            link(wires, under(n, 18), wall.at(other), 25.8 + k * 0.5, 30.1, "#eef1f7", 0.3); wall.frame(other, "#eef1f7", 26.2 + k * 0.5, 30.2); wall.flash(other, 26.4 + k * 0.5);
          });

          // ---------- a fragment that occurs twice sets its bits once ----------
          caption(30.6, 37.2, { tag, title: "No counts", sub: `Both C–N bonds turn on the same two bits. ${F.length} fragments, ${D.bits.A.length} bits.` });
          F.forEach((g, n) => { if (F.filter((h) => h.seed === g.seed).length < 2) return; const card = thumbs[n].querySelector(".thumb");
            to(card, 31.0, 31.3, { borderColor: AMBER, boxShadow: "0 0 22px rgba(255,181,71,.4)" });
            g.bits.forEach((b) => { link(wires, under(n), wall.at(b), 31.4, 35.2, AMBER, 0.3); wall.flash(b, 32.0); }); });

          // ---------- what is left is the fingerprint of molecule A ----------
          thumbs.forEach((el) => vanish(el, 35.6));
          const small = c.mol(back, "A", VIEW.a, { plain: true }); gsap.set(small.cam, HIDDEN); appear(small.cam, 35.8, 0.7);
          const who = box(ui, `<div class="who">A · N-METHYLACETAMIDE<b style="color:${BLUE}">${D.bits.A.length} bits on</b></div>`, VIEW.a.at[0], 545, HIDDEN); appear(who, 36.0);
          window.__timelines["bits"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
