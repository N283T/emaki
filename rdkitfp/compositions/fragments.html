<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 02, fragments: every connected piece of the molecule, bond by bond, branched ones included.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #fragments { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div id="fragments" data-composition-id="fragments" data-width="1920" data-height="1080">
        <div id="fragments-bg" class="layer bg"></div>
        <div id="fragments-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { chapter } = emaki, { VIEW, F, sizes, thumbHTML, rowHTML, slot, rowLabel } = emaki.film; // kit.js, film.js
          const c = chapter("fragments"), { layer, box, pop, appear, caption, HIDDEN, SMALL } = c;
          const tag = "02 · FRAGMENTS";
          const world = layer(), ui = layer(), m = c.mol(world, "A", VIEW.wide, { plain: true });
          const thumbs = F.map((f, n) => box(ui, thumbHTML(f), ...slot(n), SMALL));
          sizes.forEach((k, r) => appear(box(ui, rowHTML(k), ...rowLabel(r), { xPercent: -100, autoAlpha: 0 }), [2.0, 9.2, 17.0, 25.4][r]));
          // a fragment lights up on the molecule, and its picture joins the gallery
          const reveal = (n, t, hold = 1.0) => { m.light(F[n].bonds, t, t + hold); pop(thumbs[n], t + 0.35); };
          const of = (size) => F.map((f, n) => n).filter((n) => F[n].bonds.length === size);

          caption(0.3, 8.4, { tag, title: "Every bond is a fragment", sub: "Four bonds: four fragments of size one." });
          m.move(0.3, 1.5, VIEW.left);
          of(1).forEach((n, k) => reveal(n, 2.2 + k * 1.2));

          caption(8.6, 16.2, { tag, title: "Then two bonds that touch", sub: "Fragments grow one bond at a time, in every direction." });
          of(2).forEach((n, k) => reveal(n, 9.4 + k * 1.3));

          caption(16.4, 24.6, { tag, title: "Branches count too", sub: "A fragment need not be a path: here three bonds meet at one atom." });
          of(3).forEach((n, k) => reveal(n, k ? 19.6 + k * 1.3 : 17.2, k ? 1.0 : 2.6));

          caption(24.8, 32.0, { tag, title: "All of them, up to seven bonds", sub: `This molecule has only four, so its largest fragment is itself. ${F.length} in all.` });
          of(4).forEach((n) => reveal(n, 25.6, 2.0));
          window.__timelines["fragments"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
