<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>D-MPNN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <script src="data.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; background: #03050b; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #03050b; }
      #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #type { position: absolute; inset: 0; pointer-events: none; }
      /* a shade on the left, where the words sit, so they read over whatever glows behind them */
      #shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3,5,11,.82) 0%, rgba(3,5,11,.5) 30%, rgba(3,5,11,0) 52%); }
      #veil { position: absolute; inset: 0; background: #03050b; }
      .hud { position: absolute; inset: 0; filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.6)); }
      .ln { position: absolute; overflow: hidden; white-space: nowrap; padding: 0.08em 0.04em; }
      .ln > span { display: inline-block; }
      .big { font: 900 132px/1 Unbounded, sans-serif; letter-spacing: -0.03em; color: #f4f8ff; text-shadow: 0 0 40px rgba(94, 234, 212, 0.35); }
      .mid { font: 700 84px/1 Unbounded, sans-serif; letter-spacing: -0.02em; color: #f4f8ff; text-shadow: 0 0 30px rgba(94, 234, 212, 0.3); }
      .glow { color: #5eead4; text-shadow: 0 0 50px rgba(94, 234, 212, 0.8), 0 0 12px rgba(94, 234, 212, 0.6); }
      .hot { color: #f472b6; text-shadow: 0 0 40px rgba(244, 114, 182, 0.7); }
      .gold { color: #fbbf24; text-shadow: 0 0 40px rgba(251, 191, 36, 0.7); }
      .small { font: 600 30px/1.2 Inter, sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #9fb3d1; }
      .mono { font: 800 34px/1 "JetBrains Mono", monospace; letter-spacing: 0.2em; color: #5eead4; }
      .title { font: 900 260px/1 Unbounded, sans-serif; letter-spacing: -0.04em; color: #f4f8ff;
        text-shadow: 0 0 80px rgba(94, 234, 212, 0.75), 0 0 20px rgba(94, 234, 212, 0.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="72" data-width="1920" data-height="1080">
      <canvas id="gl"></canvas>
      <div id="shade"></div>
      <div id="type"></div>
      <div id="veil"></div>
    </div>

    <!-- The words: GSAP, on the composition's one timeline. Each line rises in from below its own edge and leaves
         upwards, as a block. The pictures are scene.js: one three.js scene, drawn from HyperFrames time. -->
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: 72 }, 0);
        const type = document.getElementById("type");
        // a line of words: `cls` sets its look; (x, y) its top left corner (or its top centre with `centre`)
        const line = (html, cls, x, y, t0, t1, { centre = false, d = 0.7 } = {}) => {
          const el = document.createElement("div"), inner = document.createElement("span");
          el.className = "ln " + cls; inner.innerHTML = html; el.appendChild(inner); type.appendChild(el);
          gsap.set(el, { x, y, xPercent: centre ? -50 : 0 });
          gsap.set(inner, { yPercent: 115 }); gsap.set(el, { autoAlpha: 0 });
          tl.set(el, { autoAlpha: 1 }, t0);
          tl.to(inner, { yPercent: 0, duration: d, ease: "power4.out" }, t0);
          tl.to(inner, { yPercent: -115, duration: 0.45, ease: "power3.in" }, t1 - 0.45);
          tl.set(el, { autoAlpha: 0 }, t1);
          return el;
        };
        // a number that counts up between t0 and t1
        const count = (el, from, to_, t0, t1, fmt) => { const o = { v: from }; tl.to(o, { v: to_, duration: t1 - t0, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t0); };

        // the veil lifts at the start and falls at the end
        tl.to("#veil", { opacity: 0, duration: 1.4, ease: "power2.inOut" }, 0.1);
        tl.to("#veil", { opacity: 1, duration: 0.9, ease: "power2.in" }, 71.0);

        // ---------- molecules are graphs ----------
        line("Molecules", "big", 140, 380, 1.0, 5.2);
        line('are <span class="glow">graphs.</span>', "big", 140, 530, 2.2, 5.2);

        // ---------- the title ----------
        const title = line("D-MPNN", "title", 960, 340, 5.8, 10.8, { centre: true, d: 0.9 });
        tl.fromTo(title, { scale: 1.25, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out" }, 5.8);
        line("Directed Message Passing Neural Network", "small", 960, 640, 6.8, 10.8, { centre: true });
        line("as in Chemprop", "small", 960, 700, 7.4, 10.8, { centre: true });

        // ---------- every bond, both ways ----------
        line("Every bond.", "big", 140, 140, 11.6, 18.6);
        line('<span class="glow">Both ways.</span>', "big", 140, 290, 12.6, 18.6);

        // ---------- messages ----------
        line("Messages", "big", 140, 140, 19.4, 30.6);
        line('<span class="glow">flow.</span>', "big", 140, 290, 20.0, 30.6);
        const rnd = line('ROUND <b id="round">1</b> / 3', "mono", 1780, 940, 21.0, 30.6);
        gsap.set(rnd, { xPercent: -100 });
        const r = rnd.querySelector("#round");
        tl.set(r, { textContent: "2" }, 24.6); tl.set(r, { textContent: "3" }, 28.0);
        line('Never <span class="hot">straight back.</span>', "small", 140, 460, 25.0, 30.6);

        // ---------- every atom, a vector ----------
        line("Every atom", "big", 140, 140, 31.6, 37.8);
        line('becomes a <span class="glow">vector.</span>', "mid", 140, 290, 32.4, 37.8);

        // ---------- one vector ----------
        line("Add them up.", "big", 140, 140, 38.6, 44.6);
        line('One molecule, <span class="glow">one vector.</span>', "mid", 140, 290, 39.6, 44.6);

        // ---------- a prediction ----------
        line("Predict.", "mid", 140, 870, 45.6, 52.6);
        const pred = line('<span class="gold" id="pred">0.00</span>', "big", 1780, 690, 50.2, 52.6);
        gsap.set(pred, { xPercent: -100 });
        gsap.set(line("PROPERTY", "small", 1780, 870, 50.4, 52.6), { xPercent: -100 });
        count(pred.querySelector("#pred"), 0, -0.8, 50.3, 51.6, (v) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(2));

        // ---------- learn ----------
        line("Predict.", "mid", 140, 870, 53.8, 63.6);
        line('<span class="hot">Compare.</span>', "mid", 620, 870, 54.8, 63.6);
        line('<span class="glow">Adjust.</span>', "mid", 1200, 870, 55.8, 63.6);
        line("Thousands of molecules. Every weight.", "small", 140, 985, 57.4, 63.6);
        const ep = line('EPOCH <b id="epoch">01</b>', "mono", 1780, 60, 54.0, 63.6);
        gsap.set(ep, { xPercent: -100 });
        count(ep.querySelector("#epoch"), 1, 50, 54.2, 63.0, (v) => String(Math.round(v)).padStart(2, "0"));

        // the loss, falling, drawn as the epochs go by
        const NS = "http://www.w3.org/2000/svg", hud = document.createElementNS(NS, "svg");
        hud.setAttribute("viewBox", "0 0 1920 1080"); hud.setAttribute("width", 1920); hud.setAttribute("height", 1080); hud.setAttribute("class", "hud");
        type.appendChild(hud);
        const pts = Array.from({ length: 80 }, (_, i) => { const e = i / 79, n = Math.sin(i * 12.9898) * 43758.5453;
          return [1240 + e * 460, 250 - 150 * (0.07 + 0.93 * Math.exp(-e * 5.5)) + ((n - Math.floor(n)) - 0.5) * 14 * (1 - e * 0.7)]; });
        hud.innerHTML = `<path d="M 1240 100 L 1240 250 L 1700 250" fill="none" stroke="#3b4a6b" stroke-width="2"/>
          <text x="1240" y="80" fill="#9fb3d1" font-family="Inter" font-weight="600" font-size="22" letter-spacing="6">LOSS</text>
          <path id="loss" d="${pts.map(([x, y], i) => `${i ? "L" : "M"} ${x.toFixed(1)} ${y.toFixed(1)}`).join(" ")}" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.1" stroke-dashoffset="1.05"/>`;
        gsap.set(hud, { autoAlpha: 0 });
        tl.to(hud, { autoAlpha: 1, duration: 0.6 }, 53.8);
        tl.to(hud.querySelector("#loss"), { strokeDashoffset: 0, duration: 8.8, ease: "power1.out" }, 54.2);
        tl.to(hud, { autoAlpha: 0, duration: 0.6 }, 63.4);

        // ---------- the end card ----------
        const end = line("D-MPNN", "title", 960, 130, 65.0, 72.5, { centre: true, d: 1.0 });
        tl.fromTo(end, { scale: 1.2, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 1.6, ease: "expo.out" }, 65.0);
        line("Learning molecules, bond by bond.", "small", 960, 430, 66.0, 72.5, { centre: true });
        line('<span class="glow">Chemprop</span>', "mid", 960, 495, 66.8, 72.5, { centre: true });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module" src="scene.js"></script>
  </body>
</html>
