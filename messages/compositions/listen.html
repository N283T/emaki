<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 03, who hears whom: the 8 × 8 table of which rows of H go into which message; three empty
         messages, and no bond hearing its own reverse.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #listen { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
        #listen .sq { width: 46px; height: 46px; border-radius: 9px; background: #141c33; border: 1.5px solid #222c46; }
        #listen .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
        #listen .ring { width: 46px; height: 46px; border-radius: 9px; border: 3px solid #ff5d5d; box-shadow: 0 0 14px rgba(255,93,93,.6); }
        #listen .band { height: 50px; border-radius: 12px; border: 3px solid #ff5d5d; box-shadow: 0 0 16px rgba(255,93,93,.5); }
        #listen .axis { font: 600 19px Inter; letter-spacing: .14em; color: #8b95ab; text-transform: uppercase; }
      </style>

      <div id="listen" data-composition-id="listen" data-width="1920" data-height="1080">
        <div id="listen-bg" class="layer bg"></div>
        <div id="listen-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { D, AMBER, RED, arrowText, chapter } = emaki, { VIEW } = emaki.film; // kit.js, film.js
          const c = chapter("listen"), { layer, box, to, set, pop, pulse, appear, vanish, show, caption, HIDDEN, SMALL } = c;
          const tag = "03 · WHO HEARS WHOM", G = D.graphs.A, K = G.edges.length, WHITE = "#eef1f7";
          const world = layer(), ui = layer(), m = c.mol(world, "A", VIEW.left);
          G.edges.forEach((_, k) => m.direct(k));
          const nums = G.edges.map((_, k) => { const [x, y] = m.beside(k, 82); const b = m.badge(x, y, k, "#d9f99d"); pop(b, 0.4 + k * 0.06); return b; });

          // ---------- the table ----------
          const S = 52, X0 = 1240, Y0 = 380, cx = (j) => X0 + j * S, cy = (k) => Y0 + k * S;
          caption(0.3, 9.0, { tag, title: "Who hears whom", sub: "A dot where a row of H goes into a message: each directed bond hears the bonds that arrive where it starts." });
          const colAxis = box(ui, `<div class="axis">row of H</div>`, cx((K - 1) / 2), Y0 - 76, HIDDEN), rowAxis = box(ui, `<div class="axis">message of</div>`, X0 - 120, Y0 - 76, HIDDEN);
          appear([colAxis, rowAxis], 0.8);
          G.edges.forEach((_, j) => appear(box(ui, `<span class="ix">${j}</span>`, cx(j), Y0 - 38, HIDDEN), 0.8 + j * 0.04));
          const labels = G.edges.map((_, k) => { const el = box(ui, `<div class="rowlbl" style="font-size:22px"><span class="ix">${k}</span>${arrowText("A", k)}</div>`, X0 - 40, cy(k), { xPercent: -100, autoAlpha: 0 }); appear(el, 0.9 + k * 0.04); return el; });
          G.edges.forEach((_, k) => G.edges.forEach((_, j) => appear(box(ui, `<div class="sq"></div>`, cx(j), cy(k), HIDDEN), 0.9 + (k + j) * 0.02, 0.3)));
          G.feeds.forEach((into, k) => {
            const t = 1.6 + k * 0.85;
            m.hot(k, t, AMBER, t + 0.8); pulse(labels[k].firstChild, t, 1.1);
            into.forEach((j) => { m.hot(j, t, WHITE, t + 0.8); pop(box(ui, `<div class="dot"></div>`, cx(j), cy(k), SMALL), t + 0.3); });
          });

          // ---------- empty messages ----------
          const empty = G.feeds.map((f, k) => k).filter((k) => !G.feeds[k].length);
          const names = empty.map((k) => arrowText("A", k)), list = names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names.at(-1)}` : names[0];
          caption(9.2, 16.4, { tag, title: "Some messages are empty", sub: `${list} leave an end of the molecule: only their own reverse arrives there, so their message is all zeros.` });
          empty.forEach((k, n) => { const t = 10.2 + n * 0.5; m.hot(k, t, RED, 16.2);
            const band = box(ui, `<div class="band" style="width:${K * S + 340}px"></div>`, (X0 - 340 + cx(K - 1) + 30) / 2, cy(k), SMALL); pop(band, t); vanish(band, 16.2); });

          // ---------- never the reverse ----------
          caption(16.6, 23.6, { tag, title: "No bond hears its reverse", sub: "The cell of each bond's own reverse stays empty. Between atoms, a message would carry back what was just sent." });
          G.rev.forEach((r, k) => { const ring = box(ui, `<div class="ring"></div>`, cx(r), cy(k), SMALL); pop(ring, 17.4 + k * 0.18); });
          G.rev.forEach((r, k) => { if (k < r) { const t = 19.4 + k * 0.4; m.hot(k, t, RED, t + 1.0); m.hot(r, t, RED, t + 1.0); } });

          c.fadeIn(); c.fadeOut();
          window.__timelines["listen"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
