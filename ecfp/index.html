<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Inside ECFP4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="player">
  <div id="viewport">
    <div id="stage">
      <canvas id="bg" width="1920" height="1080"></canvas>
      <svg id="world" viewBox="0 0 1920 1080"><g id="cam"></g></svg>
      <svg id="overlay" viewBox="0 0 1920 1080"></svg>
      <div id="actors"></div>
      <div id="cap"></div>
    </div>
    <div id="big"><div>▶</div></div>
  </div>
  <div id="controls">
    <button id="pp">▶</button>
    <div id="bar"><div class="track"></div><div class="fill"></div></div>
    <span id="time">0:00 / 0:00</span>
  </div>
</div>

<script src="movie.js"></script>
</body>
</html>
