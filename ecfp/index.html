<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    <div data-hf-id="hf-eczs" id="root" data-composition-id="main" data-start="0" data-duration="129.737" data-width="1920" data-height="1080">
      <!-- One clip per chapter, each a sub-composition. A clip's start is the film time of its first
           story second; `node sync-clips.mjs` sets them from the tempo table in kit.js. The drug chapter starts under the end of the
           similarity chapter, and the outro under the end of the drug chapter: a later clip lies on top. -->
      <div data-hf-id="hf-1vwm" id="el-intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="3.743" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-nk7z" id="el-radius1" class="clip" data-composition-id="radius1" data-composition-src="compositions/radius1.html" data-start="21.322" data-duration="23.763" data-track-index="1" data-width="1920" data-height="1080"></div>

      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
