<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Chapter 01, radius 0: six properties of an atom are hashed into its first identifier.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in kit.js. -->
  </head>
  <body>
    <template>
      <style>
        #radius0 { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div data-hf-id="hf-dxxb" id="radius0" data-composition-id="radius0" data-width="1920" data-height="1080">
        <canvas data-hf-id="hf-pujg" id="radius0-bg" class="layer" width="1920" height="1080"></canvas>
        <div data-hf-id="hf-g7qy" id="radius0-world" class="layer"></div>
        <div data-hf-id="hf-bjzg" id="radius0-stage" class="layer"></div>
        <div data-hf-id="hf-hybd" id="radius0-caps" class="layer"></div>
      </div>

      <script>
        (() => {
          const { ATOMS, BACK, VIEW, chipHTML, chapter, backdrop } = emaki; // kit.js
          const S0 = 14.2, S1 = 30.9; // story seconds, like every time below
          const { q, div, put, tl, at, to, caption, actor, fly, hashIcon, tray, molecule } = chapter("radius0", S0);
          const stage = q("#radius0-stage"), caps = q("#radius0-caps"), tag = "01 · RADIUS 0";

          backdrop(q("#radius0-bg"));
          const mol = molecule(q("#radius0-world"));

          // ---------- one methyl carbon: six numbers go into the hash, one identifier comes out ----------
          caption(caps, 14.3, 20.7, { tag, title: "Six numbers per atom", sub: "…hashed into one integer: the atom's identifier." });
          mol.move(14.2, 15.4, VIEW.methyl); mol.dim(15.0, 20.7, [0]); mol.reach(0, 0, 14.8, 20.6);
          const INV = [["Atomic number", "6"], ["Degree (incl. H)", "4"], ["Hydrogens", "3"], ["Charge", "0"], ["Isotope", "0"], ["In a ring", "no"]];
          const atom = mol.screen(ATOMS[0].x, ATOMS[0].y, VIEW.methyl), HASH = [1640, 530];
          INV.forEach(([name, value], n) => {
            const card = div(stage, "p", `<div class="card">${name}<b>${value}</b></div>`), s = 15.6 + n * 0.22;
            put(card, ...atom, { scale: 0.3, opacity: 0 });
            to(card, s, s + 0.6, { x: 1100, y: 300 + n * 92, scale: 1, opacity: 1 }, "power2.out");            // out of the atom, into a list
            to(card, 18.5 + n * 0.06, 19.2 + n * 0.06, { x: HASH[0], y: HASH[1], scale: 0.2, opacity: 0 }, "power2.in"); // into the hash
          });
          hashIcon(stage, ...HASH, 18.2, 20.4);
          const first = actor(stage, chipHTML("a"), ...HASH, { scale: 0, opacity: 0 });
          tl.set(first, { opacity: 1 }, at(19.5)); to(first, 19.5, 19.8, { scale: 1.3 }, BACK);
          const [lx, ly] = mol.labelAt(0, VIEW.methyl);
          fly(first, 19.6, 20.25, { x: lx, y: ly }, { arc: 120 });
          tl.set(first, { opacity: 0 }, at(20.25)); mol.pop(0, "a", 20.25, false); // from here on it belongs to the atom
          mol.move(20.6, 21.8, VIEW.wide);

          // ---------- the same for every atom ----------
          caption(caps, 21.0, 25.3, { tag, title: "Every atom gets one", sub: "Different properties, different identifiers." });
          [[1, "b", 22.2], [2, "c", 23.0], [3, "d", 23.8]].forEach(([n, key, s]) => { mol.reach(n, 0, s, s + 0.7); mol.pop(n, key, s + 0.2); });
          caption(caps, 25.5, 28.9, { tag, title: "Same six numbers, same identifier", sub: "Both methyls are simply [a] — for now." });
          mol.reach(0, 0, 25.8, 28.8); mol.reach(4, 0, 25.8, 28.8); mol.pop(4, "a", 26.0);

          // ---------- the identifiers are collected as a set ----------
          caption(caps, 29.0, 30.7, { tag, title: "Collect them in a set", sub: "[a] is stored once, however often it occurs." });
          const features = tray(stage);
          to(features.lbl, 29.0, 29.5, { opacity: 1 }, "power2.out");
          [0, 1, 2, 3].forEach((n) => features.collect(n, 29.0 + n * 0.2, mol.labelAt(n)));
          // the other methyl's [a] flies to the same place and disappears into the first
          const again = actor(stage, chipHTML("a"), ...mol.labelAt(4), { opacity: 0 });
          tl.set(again, { opacity: 1 }, at(29.1));
          fly(again, 29.1, 30.0, { x: features.xy(0)[0], y: features.xy(0)[1], scale: 0.85 }, { arc: 220 });
          to(again, 29.8, 30.05, { opacity: 0 });
          window.__timelines["radius0"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
