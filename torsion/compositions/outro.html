<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- The closing card: the title again, and the call that makes this fingerprint.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #outro { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div id="outro" data-composition-id="outro" data-width="1920" data-height="1080">
        <div id="outro-bg" class="layer bg"></div>
        <div id="outro-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { D, rnd, chapter } = emaki; // kit.js
          const c = chapter("outro"), { svg, canvas, layer, box, to, appear, caption, HIDDEN } = c;

          // the chains of the title card, fainter
          const sky = canvas();
          for (let n = 0; n < 16; n++) {
            const a = (n / 16) * Math.PI * 2 + rnd(n) * 0.6, r = 0.62 + rnd(n + 30) * 0.42, dir = rnd(n + 60) * Math.PI * 2, t = 0.1 + rnd(n + 90) * 1.0;
            let x = 960 + Math.cos(a) * 820 * r, y = 540 + Math.sin(a) * 430 * r;
            for (let k = 0; k < 4; k++) {
              const dot = svg("circle", { cx: x, cy: y, r: 8, fill: c.ACCENT, opacity: 0 }, sky); to(dot, t + k * 0.22, t + k * 0.22 + 0.25, { autoAlpha: 0.4 });
              if (k === 3) break;
              const turn = dir + (k % 2 ? 0.5 : -0.5), x2 = x + Math.cos(turn) * 96, y2 = y + Math.sin(turn) * 96;
              const line = svg("line", { x1: x, y1: y, x2, y2, stroke: c.ACCENT, "stroke-width": 3, "stroke-opacity": 0.22, pathLength: 1, "stroke-dasharray": "1 1.1", "stroke-dashoffset": 1.05 }, sky);
              to(line, t + k * 0.22 + 0.05, t + k * 0.22 + 0.3, { strokeDashoffset: 0 }, "power2.inOut");
              [x, y] = [x2, y2];
            }
          }
          caption(0.2, c.LEN + 1, { hero: true, title: "Topological Torsion", sub: "Paths of four. Local shape. Counts kept." });
          appear(box(layer(), `<div class="api">rdFingerprintGenerator.GetTopologicalTorsionGenerator() · RDKit ${D.rdkit}</div>`, 960, 760, HIDDEN), 1.6, 0.8);
          c.fadeIn();
          window.__timelines["outro"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
