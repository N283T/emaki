<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Title card over a scatter of four-atom chains, then the molecule draws itself: N-methylacetamide.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #intro { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div id="intro" data-composition-id="intro" data-width="1920" data-height="1080">
        <div id="intro-bg" class="layer bg"></div>
        <div id="intro-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { rnd, chapter } = emaki, { VIEW } = emaki.film; // kit.js, film.js
          const c = chapter("intro"), { svg, canvas, layer, to, vanish, caption } = c;

          // ---------- the title, over chains of four points ----------
          const sky = canvas();
          for (let n = 0; n < 16; n++) {
            const a = (n / 16) * Math.PI * 2 + rnd(n) * 0.6, r = 0.62 + rnd(n + 30) * 0.42, dir = rnd(n + 60) * Math.PI * 2, t = 0.1 + rnd(n + 90) * 1.3;
            let x = 960 + Math.cos(a) * 820 * r, y = 540 + Math.sin(a) * 430 * r;
            for (let k = 0; k < 4; k++) {
              const dot = svg("circle", { cx: x, cy: y, r: 8, fill: c.ACCENT, opacity: 0 }, sky); to(dot, t + k * 0.22, t + k * 0.22 + 0.25, { autoAlpha: 0.75 });
              if (k === 3) break;
              const turn = dir + (k % 2 ? 0.5 : -0.5), x2 = x + Math.cos(turn) * 96, y2 = y + Math.sin(turn) * 96;
              const line = svg("line", { x1: x, y1: y, x2, y2, stroke: c.ACCENT, "stroke-width": 3, "stroke-opacity": 0.4, pathLength: 1, "stroke-dasharray": "1 1.1", "stroke-dashoffset": 1.05 }, sky);
              to(line, t + k * 0.22 + 0.05, t + k * 0.22 + 0.3, { strokeDashoffset: 0 }, "power2.inOut");
              [x, y] = [x2, y2];
            }
          }
          vanish(sky, 3.3, 0.5);
          caption(0.1, 3.1, { hero: true, title: "Topological Torsion", sub: "Four atoms in a row, and what hangs off them" });

          // ---------- the molecule ----------
          const m = c.mol(layer(), "A", VIEW.wide, { drawn: false });
          m.drawIn(3.5);
          caption(3.5, 7.6, { title: "N-methylacetamide", sub: "CC(=O)NC — the molecule from the ECFP4 film" });
          window.__timelines["intro"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
