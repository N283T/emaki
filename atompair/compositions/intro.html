<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Title card over every pair of a handful of points, then the molecule draws itself: N-methylacetamide.
         Only the <template> is mounted. It relies on the host page's <head> for the fonts, the
         shared classes in style.css and the data and helpers in data.js, kit.js and film.js. -->
  </head>
  <body>
    <template>
      <style>
        #intro { position: absolute; inset: 0; overflow: hidden; background: #070a12; color: #eef1f7;
          font-family: Inter, system-ui, sans-serif; }
      </style>

      <div id="intro" data-composition-id="intro" data-width="1920" data-height="1080">
        <div id="intro-bg" class="layer bg"></div>
        <div id="intro-stage" class="layer"></div>
      </div>

      <script>
        (() => {
          const { rnd, chapter } = emaki, { VIEW } = emaki.film; // kit.js, film.js
          const c = chapter("intro"), { svg, canvas, layer, to, set, vanish, caption } = c;

          // ---------- the title, over a handful of points and every pair of them ----------
          const sky = canvas(), N = 13;
          const pts = Array.from({ length: N }, (_, n) => { const a = (n / N) * Math.PI * 2 + rnd(n) * 0.5, r = 0.72 + rnd(n + 40) * 0.36;
            return [960 + Math.cos(a) * 780 * r, 540 + Math.sin(a) * 400 * r]; });
          let k = 0;
          for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++, k++) {
            const [x1, y1] = pts[i], [x2, y2] = pts[j], t = 0.15 + rnd(k + 7) * 1.5;
            const line = svg("line", { x1, y1, x2, y2, stroke: c.ACCENT, "stroke-width": 1.5, "stroke-opacity": 0.28, pathLength: 1, "stroke-dasharray": "1 1.1", "stroke-dashoffset": 1.05 }, sky);
            to(line, t, t + 0.7, { strokeDashoffset: 0 }, "power2.inOut");
          }
          pts.forEach(([cx, cy], n) => { const dot = svg("circle", { cx, cy, r: 7, fill: c.ACCENT, opacity: 0 }, sky); to(dot, 0.05 + n * 0.03, 0.4 + n * 0.03, { autoAlpha: 0.9 }); });
          vanish(sky, 3.3, 0.5);
          caption(0.1, 3.1, { hero: true, title: "Atom Pair", sub: "Every pair of atoms, and how far apart they are" });

          // ---------- the molecule ----------
          const m = c.mol(layer(), "A", VIEW.wide, { drawn: false });
          m.drawIn(3.5);
          caption(3.5, 7.6, { title: "N-methylacetamide", sub: "CC(=O)NC — the molecule from the ECFP4 film" });

          window.__timelines["intro"] = c.tl;
        })();
      </script>
    </template>
  </body>
</html>
